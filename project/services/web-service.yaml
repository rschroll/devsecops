apiVersion: v1
kind: Namespace
metadata:
  name: dso-project
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  namespace: dso-project
  labels:
    app: web-service
spec:
  selector:
    matchLabels:
      app: web-service
  replicas: 3
  template:
    metadata:
      labels:
        app: web-service
    spec:
      containers:
        - name: web-container
          image: web-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: "http"
          env:
            - name: OLLAMA_URL
              value: "http://ollama-service.dso-project.svc.cluster.local:11434"
---
apiVersion: v1
kind: Service
metadata:
  name: web-server
  namespace: dso-project
spec:
  type: ClusterIP
  selector:
    app: web-service
  ports:
    - name: http
      port: 8000
      targetPort: http